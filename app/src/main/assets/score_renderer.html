<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #16110a;
            font-family: "Roboto", sans-serif;
        }
        /* Bladmuziek meelaten met donker thema (instelling): keer het hele blad om,
           met behoud van kleurtinten. */
        html.dark, body.dark { background: #121212; }
        .dark #root { background: #ffffff; filter: invert(1) hue-rotate(180deg); }
        #root {
            padding: 0;
            box-sizing: border-box;
        }
        #main {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }
        #controls-bottom {
            margin-top: auto;
        }
        #score {
            width: 100%;
            display: block;
        }
        :root { --playback-highlight: #00695C; }
        .playback-note.playback-active { stroke: var(--playback-highlight) !important; }
        .playback-note-filled.playback-active,
        .playback-lyric.playback-active { fill: var(--playback-highlight) !important; }
        .verse-matrix {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 3px;
            padding: 8px 10px 8px;
            background: #ffffff;
        }
        .verse-matrix button {
            width: 34px;
            height: 30px;
            border: none;
            background: transparent;
            color: #8a8f8a;
            border-radius: 15px;
            font: 400 14px sans-serif;
        }
        .verse-matrix button.current {
            background: #4b6748;
            color: #ffffff;
            font-weight: 600;
        }
        .nav-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 8px 10px 6px;
            background: #ffffff;
        }
        .nav-row button {
            flex: 1;
            max-width: 220px;
            height: 44px;
            border: 1px solid #d5d9d2;
            background: #ffffff;
            color: #4a4f4a;
            border-radius: 4px;
            font: 600 15px sans-serif;
        }
        .nav-row button:disabled {
            color: #b0b0b0;
            background: #f0f0f0;
        }
        .ctrl-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 7px 10px;
            background: #ffffff;
        }
        .ctrl-row .label {
            width: 132px;
            font: 600 15px sans-serif;
            color: #4a4f4a;
        }
        .ctrl-row .label-icon {
            display: none;
        }
        .ctrl-row .value {
            min-width: 56px;
            text-align: center;
            font: 600 15px sans-serif;
            color: #4a4f4a;
        }
        .ctrl-row button {
            width: 48px;
            height: 42px;
            border: none;
            background: transparent;
            color: #4a4f4a;
            font: 700 20px sans-serif;
            padding: 0;
        }
        .ctrl-row button svg {
            display: none;
        }
        .error {
            color: #b00020;
            padding: 20px;
            font-family: sans-serif;
        }
        .pdf-export, .pdf-export body, .pdf-export #root, .pdf-export #main {
            background: #ffffff !important;
            min-height: auto !important;
        }
        .pdf-export #root {
            filter: none !important;
        }
        .pdf-export #controls-top, .pdf-export #controls-bottom, .pdf-export #verse-section {
            display: none !important;
        }
        @media print {
            @page {
                size: A4 portrait;
                margin: 10mm;
            }
            html, body, #root, #main {
                background: #ffffff !important;
                min-height: auto !important;
            }
            #root {
                filter: none !important;
            }
            #controls-top, #controls-bottom, #verse-section {
                display: none !important;
            }
            #score {
                width: 100% !important;
            }
        }
    </style>
</head>
<body>
    <div id="root">
        <div id="controls-top"></div>
        <div id="main">
            <svg id="score" xmlns="http://www.w3.org/2000/svg"></svg>
            <div id="controls-bottom"></div>
        </div>
        <div id="verse-section"></div>
    </div>

    <script>
    "use strict";

    var SVGNS = "http://www.w3.org/2000/svg";
    var STEP_INDEX = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 };

    // --- Geometrie (in SVG-pixels). S en lettergrootte schalen mee met de zoom-knoppen. ---
    var BASE_S = 8;            // basis-afstand tussen twee balklijnen (compacte balk)
    var BASE_FONT = 12;       // basis lettergrootte (voor de tekst-zoom); genormaliseerd zodat korte-regel psalmen niet te groot worden
    var MAX_STRETCH = 1.8;    // maximale horizontale rek van een regel (voorkomt te grote woordafstand)
    var SHORT_LINE_STRETCH = 1.2; // korte regels krijgen iets meer ademruimte als de breedte dat toelaat
    var S = BASE_S;
    var FONT_SIZE = BASE_FONT;
    var ASCENT = 4.6 * S;     // ruimte boven de balk (hoge noten/stokken)
    var DESCENT = 3.6 * S;    // ruimte onder de balk (lage noten/stokken)
    var TEXT_GAP = 9;         // ruimte tussen balk en tekst (tekst iets lager)
    var LINE_GAP = 2;         // ruimte tussen frase-regels
    var LEFT_MARGIN = 4;
    var RIGHT_MARGIN = 5;
    var CLEF_WIDTH = 26;      // gereserveerde ruimte voor sleutel + voortekening
    var WORD_GAP = S * 1.3;   // ruimte tussen woorden
    var LARGE_TEXT = false;   // 'grote letters'-modus: minimale woordafstand
    var ALLOW_WRAP = false;   // 'regelafbreking toestaan': lange regel over 2 rijen
    var SHOW_LYRICS = true;   // weergave 'noten': tekst onder de noten verbergen
    var HAS_EIGHTH_NOTES = false; // bij achtste-noten-muziek geen kwart-cursief en rusten altijd tonen
    var ACTIVE_PLAYBACK_ID = "";
    var SYL_GAP = S * 0.12;   // minieme ruimte binnen een woord
    var MIN_SLOT = S * 1.1;
    var NOTE_STEP = S * 2.25; // minimale afstand tussen melisma-noten binnen één lettergreep

    var STAFF_LINE_TOP = 38;    // diatonische waarde bovenste balklijn (F5)
    var STAFF_LINE_MID = 34;    // middelste balklijn (B4)
    var STAFF_LINE_BOTTOM = 30; // onderste balklijn (E4)

    function recomputeGeometry(noteScale, textScale) {
        S = BASE_S * noteScale;
        FONT_SIZE = BASE_FONT * textScale;
        ASCENT = 4.6 * S;
        DESCENT = 3.6 * S;
        WORD_GAP = FONT_SIZE * (LARGE_TEXT ? 0.42 : 0.55);
        SYL_GAP = FONT_SIZE * 0.02;
        MIN_SLOT = S * 1.1;
        NOTE_STEP = S * 2.25;
    }

    function readNumber(fn, fallback) {
        try {
            var v = Number(fn());
            return isFinite(v) && v > 0 ? v : fallback;
        } catch (e) {
            return fallback;
        }
    }

    var measureCanvas = document.createElement("canvas").getContext("2d");

    function diatonic(step, octave) {
        return octave * 7 + (STEP_INDEX[step] || 0);
    }

    function measureText(text, italic, font) {
        measureCanvas.font = (italic ? "italic " : "") + (font || FONT_SIZE) + "px 'Roboto', sans-serif";
        return measureCanvas.measureText(text || "").width;
    }

    function keyAlterForStep(step, fifths) {
        var flats = ["B", "E", "A", "D", "G", "C", "F"];
        var sharps = ["F", "C", "G", "D", "A", "E", "B"];
        if (fifths < 0) {
            return flats.slice(0, -fifths).indexOf(step) !== -1 ? -1 : 0;
        }
        if (fifths > 0) {
            return sharps.slice(0, fifths).indexOf(step) !== -1 ? 1 : 0;
        }
        return 0;
    }

    // Standaard diatonische posities voor de voortekening (vioolsleutel).
    var FLAT_POSITIONS = [34, 37, 33, 36, 32, 35, 31];   // B E A D G C F
    var SHARP_POSITIONS = [38, 35, 39, 36, 33, 37, 34];  // F C G D A E B

    function el(name, attrs) {
        var node = document.createElementNS(SVGNS, name);
        if (attrs) {
            Object.keys(attrs).forEach(function(key) {
                node.setAttribute(key, attrs[key]);
            });
        }
        return node;
    }

    function renderScore() { renderScoreInternal(true); }
    function updateScore() { renderScoreInternal(false); }

    function appendTrebleClef(svg, x, staffTop, staffGap) {
        var clef = el("text", {
            x: x,
            y: staffTop + 4.15 * staffGap,
            "font-size": 3.5 * staffGap,
            "font-family": "Bravura, 'Noto Music', Georgia, serif",
            fill: "#16110a"
        });
        clef.textContent = "\uD834\uDD1E";
        svg.appendChild(clef);
        return clef;
    }

    // Grand-staff clefs: natural proportions, placed by measured glyph bounds on the
    // MusicXML reference lines (G sign on line 2, F sign on line 4, counted from the bottom).
    var GRAND_CLEF_FONT = "Bravura, 'Noto Music', 'Segoe UI Symbol', Georgia, serif";

    function appendGrandTrebleClef(svg, x, staffTop, staffGap) {
        var clef = el("text", { x: 0, y: 0, "font-size": 5.6 * staffGap, "font-family": GRAND_CLEF_FONT, fill: "#16110a" });
        clef.textContent = "\uD834\uDD1E";
        svg.appendChild(clef);
        var box = clef.getBBox();
        var centerTarget = staffTop + 3 * staffGap; // line 2 from bottom (G)
        clef.setAttribute("transform", "translate(" + (x - box.x) + " " + (centerTarget - (box.y + box.height / 2)) + ")");
        return clef;
    }

    function appendGrandBassClef(svg, x, staffTop, staffGap) {
        var clef = el("text", { x: 0, y: 0, "font-size": 3.3 * staffGap, "font-family": GRAND_CLEF_FONT, fill: "#16110a" });
        clef.textContent = "\uD834\uDD22";
        svg.appendChild(clef);
        var box = clef.getBBox();
        var topTarget = staffTop - 0.1 * staffGap; // glyph top at the top staff line
        clef.setAttribute("transform", "translate(" + (x - box.x) + " " + (topTarget - box.y) + ")");
        return clef;
    }

    function setPlaybackHighlight(playbackId) {
        ACTIVE_PLAYBACK_ID = playbackId || "";
        document.querySelectorAll(".playback-active").forEach(function(node) {
            node.classList.remove("playback-active");
        });
        if (!ACTIVE_PLAYBACK_ID) return;
        document.querySelectorAll("[data-playback-id], [data-playback-ids]").forEach(function(node) {
            var exact = node.getAttribute("data-playback-id");
            var group = (node.getAttribute("data-playback-ids") || "").split("|");
            if (exact === ACTIVE_PLAYBACK_ID || group.indexOf(ACTIVE_PLAYBACK_ID) !== -1) {
                node.classList.add("playback-active");
            }
        });
    }

    function setPlaybackHighlightColor(color) {
        var safe = /^#[0-9A-Fa-f]{6}$/.test(color) ? color : "#00695C";
        document.documentElement.style.setProperty("--playback-highlight", safe);
    }

    // Rusten: standaard aan het EIND van de vorige regel (niet vóór een zin). Wanneer
    // rusten uitstaan worden ze volledig weggelaten.
    // Deze functie is pure: bronmodel blijft ongewijzigd.
    function preprocessRests(lines, showRests) {
        var cloned = (lines || []).map(function(line) {
            var slots = (line.slots || []).map(function(slot) {
                return {
                    text: slot.text || "",
                    syllabic: slot.syllabic || "",
                    rest: !!slot.rest,
                    notes: (slot.notes || []).map(function(n) { return Object.assign({}, n); })
                };
            });
            return {
                slots: slots,
                verseStart: !!line.verseStart,
                verseEnd: !!line.verseEnd,
                verseNumber: line.verseNumber
            };
        });

        if (!showRests) {
            return cloned.map(function(line) {
                return {
                    slots: (line.slots || []).filter(function(s) { return !s.rest; }),
                    verseStart: !!line.verseStart,
                    verseEnd: !!line.verseEnd,
                    verseNumber: line.verseNumber
                };
            });
        }

        for (var j = 1; j < cloned.length; j++) {
            var slots = cloned[j].slots || [];
            while (slots.length && slots[0].rest) {
                var moved = slots.shift();
                cloned[j - 1].slots = (cloned[j - 1].slots || []);
                cloned[j - 1].slots.push(moved);
            }
            cloned[j].slots = slots;
        }
        return cloned;
    }

    function modelHasEighthNotes(model) {
        var lines = model.lines || [];
        for (var i = 0; i < lines.length; i++) {
            var slots = lines[i].slots || [];
            for (var j = 0; j < slots.length; j++) {
                var notes = slots[j].notes || [];
                for (var k = 0; k < notes.length; k++) {
                    if (notes[k].type === "eighth") {
                        return true;
                    }
                }
            }
        }
        return false;
    }

    function renderFourPartScore(svg, harmony, width, noteScale) {
        var parts = harmony.parts || [];
        if (parts.length !== 4) return false;
        var lineCount = Math.min.apply(null, parts.map(function(part) {
            return (part.lines || []).length;
        }));
        if (!lineCount) return false;

        var staffGap = Math.max(7, 10 * noteScale);
        var left = 58;
        var right = width - 12;
        var systemGap = staffGap * 17;
        var totalHeight = 8 + lineCount * systemGap;
        svg.setAttribute("width", width);
        svg.setAttribute("height", totalHeight);
        svg.setAttribute("viewBox", "0 0 " + width + " " + totalHeight);
        svg.appendChild(el("rect", {
            x: 0, y: 0, width: width, height: totalHeight,
            fill: "transparent", "pointer-events": "all"
        }));

        function drawStaff(top) {
            for (var staffLine = 0; staffLine < 5; staffLine++) {
                var y = top + staffLine * staffGap;
                svg.appendChild(el("line", {
                    x1: left, y1: y, x2: right, y2: y,
                    stroke: "#16110a", "stroke-width": 1
                }));
            }
        }

        function drawHarmonyKeySignature(top, clef) {
            var sharpSteps = clef === "G"
                ? [{ step: "F", octave: 5 }, { step: "C", octave: 5 }]
                : [{ step: "F", octave: 3 }, { step: "C", octave: 3 }];
            var count = Math.min(Math.max(harmony.fifths || 0, 0), sharpSteps.length);
            for (var keyIndex = 0; keyIndex < count; keyIndex++) {
                var keyNote = sharpSteps[keyIndex];
                var accidental = el("text", {
                    x: left + 47 + keyIndex * staffGap * 1.4,
                    y: noteY(keyNote, top, clef) + staffGap * 0.55,
                    "font-size": staffGap * 2.0,
                    "font-family": "Georgia, serif",
                    fill: "#16110a"
                });
                accidental.textContent = "\u266F";
                svg.appendChild(accidental);
            }
        }

        function noteY(note, top, clef) {
            var bottomReference = clef === "G" ? 30 : 18; // E4 resp. G2
            return top + 4 * staffGap - (diatonic(note.step, note.octave) - bottomReference) * staffGap / 2;
        }

        function drawHarmonyNote(note, x, top, clef, stemUp, playbackId) {
            if (!note || note.rest) return;
            var y = noteY(note, top, clef);
            var topLine = top;
            var bottomLine = top + 4 * staffGap;
            var ledgerHalf = staffGap * 0.9;
            for (var ledger = topLine - staffGap; ledger >= y - staffGap / 2; ledger -= staffGap) {
                svg.appendChild(el("line", { x1: x - ledgerHalf, y1: ledger, x2: x + ledgerHalf, y2: ledger, stroke: "#16110a" }));
            }
            for (ledger = bottomLine + staffGap; ledger <= y + staffGap / 2; ledger += staffGap) {
                svg.appendChild(el("line", { x1: x - ledgerHalf, y1: ledger, x2: x + ledgerHalf, y2: ledger, stroke: "#16110a" }));
            }
            var keyAlter = keyAlterForStep(note.step, harmony.fifths || 0);
            var alter = note.alter == null ? 0 : note.alter;
            if (alter !== keyAlter) {
                var glyph = alter > 0 ? "\u266F" : (alter < 0 ? "\u266D" : "\u266E");
                var accidental = el("text", {
                    x: x - staffGap * 1.25, y: y + staffGap * 0.5, "font-size": staffGap * 1.6,
                    "font-family": "Georgia, serif",
                    fill: "#16110a",
                    "class": playbackId ? "playback-note-filled" : "",
                    "data-playback-id": playbackId || ""
                });
                accidental.textContent = glyph;
                svg.appendChild(accidental);
            }
            var open = note.type === "half" || note.type === "whole";
            svg.appendChild(el("ellipse", {
                cx: x, cy: y, rx: staffGap * 0.6, ry: staffGap * 0.46,
                transform: "rotate(-20 " + x + " " + y + ")",
                fill: open ? "none" : "#16110a", stroke: "#16110a",
                "stroke-width": open ? 1.5 : 1,
                "class": playbackId ? (open ? "playback-note" : "playback-note playback-note-filled") : "",
                "data-playback-id": playbackId || ""
            }));
            if (note.type !== "whole") {
                var stemX = stemUp ? x + staffGap * 0.56 : x - staffGap * 0.56;
                var stemEnd = stemUp ? y - staffGap * 3.0 : y + staffGap * 3.0;
                svg.appendChild(el("line", {
                    x1: stemX, y1: y, x2: stemX, y2: stemEnd,
                    stroke: "#16110a", "stroke-width": 1.4,
                    "class": playbackId ? "playback-note" : "",
                    "data-playback-id": playbackId || ""
                }));
            }
        }

        // Two voices per staff: upper stem up, lower stem down; offset noteheads a
        // second/unison apart so they do not collide (standard chorale engraving).
        function drawChoralePair(upper, lower, x, top, clef, upperPlaybackId) {
            var collide = upper && lower && !upper.rest && !lower.rest &&
                Math.abs(diatonic(upper.step, upper.octave) - diatonic(lower.step, lower.octave)) <= 1;
            drawHarmonyNote(upper, x, top, clef, true, upperPlaybackId);
            drawHarmonyNote(lower, collide ? x - staffGap * 1.15 : x, top, clef, false, "");
        }

        for (var lineIndex = 0; lineIndex < lineCount; lineIndex++) {
            var systemTop = 8 + lineIndex * systemGap;
            var trebleTop = systemTop + staffGap * 1.8;
            var bassTop = systemTop + staffGap * 9.6;
            drawStaff(trebleTop);
            drawStaff(bassTop);
            svg.appendChild(el("line", { x1: left, y1: trebleTop, x2: left, y2: bassTop + 4 * staffGap, stroke: "#16110a", "stroke-width": 1.5 }));
            appendGrandTrebleClef(svg, left + 6, trebleTop, staffGap);
            appendGrandBassClef(svg, left + 8, bassTop, staffGap);
            drawHarmonyKeySignature(trebleTop, "G");
            drawHarmonyKeySignature(bassTop, "F");

            var sopranoLine = parts[0].lines[lineIndex] || [];
            var totalDuration = sopranoLine.reduce(function(sum, note) { return sum + (note.duration || 2); }, 0) || 1;
            var cursor = 0;
            var noteStart = left + 96;
            for (var eventIndex = 0; eventIndex < sopranoLine.length; eventIndex++) {
                var duration = sopranoLine[eventIndex].duration || 2;
                var x = noteStart + (right - noteStart - 14) * (cursor + duration / 2) / totalDuration;
                cursor += duration;
                var playbackId = sopranoLine[eventIndex].playbackId || "";
                drawChoralePair(sopranoLine[eventIndex], parts[1].lines[lineIndex][eventIndex], x, trebleTop, "G", playbackId);
                drawChoralePair(parts[2].lines[lineIndex][eventIndex], parts[3].lines[lineIndex][eventIndex], x, bassTop, "F", "");
            }
            svg.appendChild(el("line", { x1: right, y1: trebleTop, x2: right, y2: trebleTop + 4 * staffGap, stroke: "#16110a", "stroke-width": 2 }));
            svg.appendChild(el("line", { x1: right, y1: bassTop, x2: right, y2: bassTop + 4 * staffGap, stroke: "#16110a", "stroke-width": 2 }));
        }
        window.__verseRanges = [{ startY: 0, endY: totalHeight }];
        return true;
    }

    function renderScoreInternal(scrollToScore) {
        var previousScroll = window.scrollY || window.pageYOffset || 0;
        var svg = document.getElementById("score");
        while (svg.firstChild) {
            svg.removeChild(svg.firstChild);
        }

        // Dubbeltik op notenbalk, tekst of witte ruimte eronder = volledig scherm aan/uit.
        // Uitgesloten: de navigatieknoppen in controls-bottom.
        if (!window.__dtapAttached) {
            window.__dtapAttached = true;
            var lastTouchEnd = 0;
            var main = document.getElementById("main");
            main.addEventListener("touchend", function(ev) {
                if (ev.target.closest && ev.target.closest("#controls-bottom")) return;
                var now = Date.now();
                if (lastTouchEnd && (now - lastTouchEnd) < 350) {
                    ev.preventDefault();
                    lastTouchEnd = 0;
                    try { Android.toggleFullscreen(); } catch (e) {}
                } else {
                    lastTouchEnd = now;
                }
            }, { passive: false });
        }

        var model;
        try {
            model = JSON.parse(Android.getScoreModel());
        } catch (e) {
            showError("Kon het notenmodel niet lezen: " + e);
            return;
        }
        if (model && model.error) {
            showError("Kon dit vers niet laden: " + model.error);
            return;
        }
        if (!model || !model.lines || !model.lines.length) {
            showError("Geen noten gevonden voor dit vers.");
            return;
        }

        var showFourPart = false;
        var harmony = null;
        try {
            showFourPart = Android.getShowFourPartScore() === true;
            setPlaybackHighlightColor(Android.getPlaybackHighlightColor());
            if (showFourPart) harmony = JSON.parse(Android.getHarmonyModel());
        } catch (e) {
            showFourPart = false;
        }
        if (showFourPart && harmony && harmony.parts && harmony.parts.length === 4) {
            var harmonyWidth = document.getElementById("root").clientWidth || window.innerWidth || 800;
            var harmonyScale = readNumber(function() { return Android.getScoreVerticalScale(); }, 1);
            try { document.documentElement.classList.toggle("dark", Android.getSheetDark() === true); } catch (e) {}
            if (renderFourPartScore(svg, harmony, harmonyWidth, harmonyScale)) {
                window.__hasModel = true;
                renderControls();
                setPlaybackHighlight(ACTIVE_PLAYBACK_ID);
                window.requestAnimationFrame(function() {
                    var top = document.getElementById("controls-top");
                    var topH = top ? top.offsetHeight : 0;
                    window.scrollTo(0, scrollToScore ? topH : previousScroll);
                });
                return;
            }
        }

        var showRests = true;
        try { showRests = (Android.getShowRests() !== false); } catch (e) { showRests = true; }
    HAS_EIGHTH_NOTES = modelHasEighthNotes(model);
    if (HAS_EIGHTH_NOTES) { showRests = true; }
        model = Object.assign({}, model, {
            lines: preprocessRests(model.lines || [], showRests)
        });

        var TEXT_ALIGN = 1; // 0=links, 1=centrisch, 2=vullend
        try { TEXT_ALIGN = Android.getTextAlign(); } catch (e) { TEXT_ALIGN = 1; }

        var width = document.getElementById("root").clientWidth || window.innerWidth || 360;
        var fifths = model.fifths || 0;
        var noteScale = readNumber(function() { return Android.getScoreVerticalScale(); }, 1);
        var textScale = readNumber(function() { return Android.getLyricTextScale(); }, 1);
        try { LARGE_TEXT = (Android.getLargeText() === true); } catch (e) { LARGE_TEXT = false; }
        try { ALLOW_WRAP = (Android.getAllowLineWrap() === true); } catch (e) { ALLOW_WRAP = false; }
        try { SHOW_LYRICS = (Android.getShowLyrics() !== false); } catch (e) { SHOW_LYRICS = true; }
        var COMBINE_LINES = false;
        try { COMBINE_LINES = (Android.getCombineLines() === true); } catch (e) { COMBINE_LINES = false; }
        try { document.documentElement.classList.toggle("dark", Android.getSheetDark() === true); } catch (e) {}
        recomputeGeometry(noteScale, textScale);

        // Per regel de werkelijke verticale ruimte (noten + stokken) bepalen,
        // zodat er geen vaste, grote witruimte boven/onder de balk overblijft.
        var TOP_PAD = 3;

        // Regel 1 heeft de sleutel (meer inspring); regels 2+ schuiven naar links
        // en gebruiken de vrijgekomen ruimte.
        function staffStartXFor(showClef) {
            var keysigWidth = Math.abs(fifths) * 8;
            return showClef
                ? LEFT_MARGIN + CLEF_WIDTH + keysigWidth + 2
                : LEFT_MARGIN + keysigWidth + 3;
        }

        var baseMetrics = { font: FONT_SIZE, wordGap: WORD_GAP, sylGap: SYL_GAP, minSlot: MIN_SLOT };

        // Fysieke rijen: normaal 1 rij per modelregel. Met 'regelafbreking toestaan'
        // wordt een te lange regel over 2 rijen verdeeld (2e rij rechts uitgelijnd),
        // zodat de tekst groter kan blijven i.p.v. sterk terug te schalen.
        function buildRows() {
            var rows = [];
            // 'Twee zinnen op één regel': combineer opeenvolgende regels (max 2) als ze
            // samen op de breedte passen (handig in landscape/op tablets).
            if (COMBINE_LINES && model.multiVerse !== true) {
                var k = 0;
                while (k < model.lines.length) {
                    var showClefK = (k === 0);
                    var availK = Math.max(1, width - staffStartXFor(showClefK) - RIGHT_MARGIN);
                    var slotsK = (model.lines[k].slots || []).slice();
                    if (k + 1 < model.lines.length) {
                        var combinedK = slotsK.concat(model.lines[k + 1].slots || []);
                        var natK = computeLayout({ slots: combinedK }, baseMetrics).naturalWidth;
                        if (natK <= availK) {
                            rows.push({
                                slots: combinedK,
                                showClef: showClefK,
                                cont: false,
                                verseStart: !!model.lines[k].verseStart,
                                verseNumber: model.lines[k].verseNumber,
                                verseEnd: !!model.lines[k + 1].verseEnd
                            });
                            k += 2;
                            continue;
                        }
                    }
                    rows.push({
                        slots: slotsK,
                        showClef: showClefK,
                        cont: false,
                        verseStart: !!model.lines[k].verseStart,
                        verseNumber: model.lines[k].verseNumber,
                        verseEnd: !!model.lines[k].verseEnd
                    });
                    k += 1;
                }
                return rows;
            }
            for (var i = 0; i < model.lines.length; i++) {
                var sourceLine = model.lines[i] || {};
                var slots = sourceLine.slots || [];
                var showClefLine = (i === 0);
                var avail = Math.max(1, width - staffStartXFor(showClefLine) - RIGHT_MARGIN);
                var natural = computeLayout(model.lines[i], baseMetrics).naturalWidth;
                if (ALLOW_WRAP && natural > avail && slots.length >= 4) {
                    var half = slots.length / 2;
                    var best = -1, bestd = 1e9;
                    for (var s = 1; s < slots.length; s++) {
                        if (startsNewWord(slots[s])) {
                            var dd = Math.abs(s - half);
                            if (dd < bestd) { bestd = dd; best = s; }
                        }
                    }
                    if (best > 0 && best < slots.length) {
                        rows.push({
                            slots: slots.slice(0, best),
                            showClef: showClefLine,
                            cont: false,
                            verseStart: !!sourceLine.verseStart,
                            verseNumber: sourceLine.verseNumber,
                            verseEnd: false
                        });
                        rows.push({
                            slots: slots.slice(best),
                            showClef: false,
                            cont: true,
                            verseStart: false,
                            verseNumber: sourceLine.verseNumber,
                            verseEnd: !!sourceLine.verseEnd
                        });
                        continue;
                    }
                }
                rows.push({
                    slots: slots,
                    showClef: showClefLine,
                    cont: false,
                    verseStart: !!sourceLine.verseStart,
                    verseNumber: sourceLine.verseNumber,
                    verseEnd: !!sourceLine.verseEnd
                });
            }
            return rows;
        }
        var rows = buildRows();

        var extents = rows.map(function(r) { return lineVerticalExtent({ slots: r.slots }); });
        var staffTops = [];
        var rowBounds = [];
        var verseSeparators = [];
        var y = 4;
        var VERSE_SEPARATOR_GAP = 14;
        for (var idx = 0; idx < rows.length; idx++) {
            if (rows[idx].verseStart && idx > 0) {
                verseSeparators.push(y + Math.floor(VERSE_SEPARATOR_GAP / 2));
                y += VERSE_SEPARATOR_GAP;
            }
            var ext = extents[idx];
            var rowTop = y;
            staffTops.push(y + TOP_PAD + ext.above);
            var rowHeight = TOP_PAD + ext.above + 4 * S + ext.below + TEXT_GAP + FONT_SIZE + LINE_GAP;
            y += rowHeight;
            rowBounds.push({ top: rowTop, bottom: y });
        }
        var totalHeight = y + 4;

        var verseRanges = [];
        var activeStart = null;
        for (var ri = 0; ri < rows.length; ri++) {
            if (rows[ri].verseStart || activeStart === null) {
                if (activeStart !== null && ri > 0) {
                    verseRanges.push({ startY: activeStart, endY: rowBounds[ri - 1].bottom });
                }
                activeStart = rowBounds[ri].top;
            }
            if (rows[ri].verseEnd && activeStart !== null) {
                verseRanges.push({ startY: activeStart, endY: rowBounds[ri].bottom });
                activeStart = null;
            }
        }
        if (activeStart !== null && rowBounds.length) {
            verseRanges.push({ startY: activeStart, endY: rowBounds[rowBounds.length - 1].bottom });
        }
        if (!verseRanges.length) {
            verseRanges.push({ startY: 0, endY: totalHeight });
        }
        window.__verseRanges = verseRanges;

        svg.setAttribute("width", width);
        svg.setAttribute("height", totalHeight);
        svg.setAttribute("viewBox", "0 0 " + width + " " + totalHeight);

        // Transparant vlak zodat de HELE notenbalk-/tekstzone dubbeltikken opvangt
        // (ook lege plekken tussen de noten), voor volledig scherm.
        svg.appendChild(el("rect", {
            x: 0, y: 0, width: width, height: totalHeight,
            fill: "transparent", "pointer-events": "all"
        }));

        verseSeparators.forEach(function(sepY) {
            svg.appendChild(el("line", {
                x1: LEFT_MARGIN,
                y1: sepY,
                x2: width - RIGHT_MARGIN,
                y2: sepY,
                stroke: "#ccd3cc",
                "stroke-width": 1
            }));
        });

        // Kies één consistente schaal zodat elke rij binnen zijn eigen ruimte past.
        var minRatio = 1;
        rows.forEach(function(r) {
            var avail = Math.max(1, width - staffStartXFor(r.showClef) - RIGHT_MARGIN);
            var natural = computeLayout({ slots: r.slots }, baseMetrics).naturalWidth;
            minRatio = Math.min(minRatio, avail / natural);
        });
        var globalScale = Math.min(1, minRatio);
        var metrics = {
            font: FONT_SIZE * globalScale,
            wordGap: WORD_GAP * globalScale,
            sylGap: SYL_GAP * globalScale,
            minSlot: MIN_SLOT * globalScale
        };

        // Links en centrisch gebruiken dezelfde compacte spatiering: de langste regel
        // bepaalt de schaal; centrisch verplaatst daarna alleen de complete regel.
        var leftFillStretch = 1;
        if (TEXT_ALIGN === 0 || TEXT_ALIGN === 1) {
            var maxNat = 0, availAtMax = 1;
            rows.forEach(function(r) {
                if (r.cont) return;
                var av = Math.max(1, width - staffStartXFor(r.showClef) - RIGHT_MARGIN);
                var nat = computeLayout({ slots: r.slots }, metrics).naturalWidth;
                if (nat > maxNat) { maxNat = nat; availAtMax = av; }
            });
            leftFillStretch = maxNat > 0 ? Math.max(1, availAtMax / maxNat) : 1;
        }

        var showVerseLabels = (model.multiVerse === true);
        rows.forEach(function(r, index) {
            var showClef = r.showClef;
            var staffStartX = staffStartXFor(showClef);
            var available = Math.max(1, width - staffStartX - RIGHT_MARGIN);
            var layout = computeLayout({ slots: r.slots }, metrics);
            var rawStretch = layout.naturalWidth > 0 ? available / layout.naturalWidth : 1;
            var relativeShortLineStretch = maxNat > 0
                ? 1 + (SHORT_LINE_STRETCH - 1) * (1 - layout.naturalWidth / maxNat)
                : 1;
            var stretch, xOffset;
            if (r.cont) {
                // 2e rij van een afgebroken regel: niet oprekken, rechts uitlijnen.
                stretch = Math.min(1, rawStretch);
                xOffset = Math.max(0, available - layout.naturalWidth * stretch);
            } else if (TEXT_ALIGN === 2) {
                // Vullend: rek elke regel op tot de volle breedte.
                stretch = rawStretch;
                xOffset = 0;
            } else if (TEXT_ALIGN === 0) {
                // Links: langste regel bepaalt de schaal; korte regels krijgen beperkte extra ruimte.
                stretch = Math.min(relativeShortLineStretch * leftFillStretch, rawStretch);
                xOffset = 0;
            } else {
                // Centrisch: dezelfde relatieve verruiming als links, als geheel gecentreerd.
                stretch = Math.min(relativeShortLineStretch * leftFillStretch, rawStretch);
                xOffset = Math.max(0, (available - layout.naturalWidth * stretch) / 2);
            }
            renderLine(
                svg,
                layout,
                stretch,
                xOffset,
                staffTops[index],
                extents[index].below,
                width,
                fifths,
                staffStartX,
                metrics.font,
                showClef,
                {
                    verseStart: r.verseStart,
                    verseNumber: r.verseNumber,
                    verseEnd: r.verseEnd,
                    showVerseLabel: showVerseLabels
                },
                index === rows.length - 1
            );
        });

        window.__hasModel = true;
        renderControls();
        setPlaybackHighlight(ACTIVE_PLAYBACK_ID);

        // Knoppen staan boven de balk. Bij openen/vers-wissel scrollen we voorbij
        // de bovenste knoppen (muziek bovenaan); bij knop-aanpassingen behouden we de positie.
        // De onderste knoppen staan via de flex-layout (#main min-height:100vh +
        // margin-top:auto) onderaan het scherm, of na de muziek bij lange verzen.
        window.requestAnimationFrame(function() {
            var top = document.getElementById("controls-top");
            var topH = top ? top.offsetHeight : 0;
            if (window.__pdfExport) {
                window.scrollTo(0, 0);
            } else if (scrollToScore) {
                window.scrollTo(0, topH);
            } else {
                window.scrollTo(0, previousScroll);
            }
        });
    }

    // Werkelijke verticale ruimte boven/onder de balk voor deze regel (in px).
    function lineVerticalExtent(line) {
        var above = 0.4 * S;
        var below = 0.4 * S;
        var stem = 3.3 * S;
        var half = 0.5 * S;
        (line.slots || []).forEach(function(slot) {
            (slot.notes || []).forEach(function(note) {
                if (note.rest) {
                    return;
                }
                var dia = diatonic(note.step, note.octave);
                var aboveOffset = (dia - STAFF_LINE_TOP) * (S / 2);
                var belowOffset = (STAFF_LINE_BOTTOM - dia) * (S / 2);
                var stemUp = dia < STAFF_LINE_MID;
                var top = aboveOffset + half;
                if (stemUp) {
                    top = Math.max(top, aboveOffset + stem);
                }
                var bottom = belowOffset + half;
                if (!stemUp) {
                    bottom = Math.max(bottom, belowOffset + stem);
                }
                if (top > above) { above = top; }
                if (bottom > below) { below = bottom; }
            });
        });
        return { above: above, below: below };
    }

    // Bepaalt per slot de breedte en de natuurlijke (ongerekte) x-positie.
    function computeLayout(line, metrics) {
        var slots = line.slots || [];
        var items = [];
        var cursor = 0;
        slots.forEach(function(slot, i) {
            var isRest = !!slot.rest;
            var italic = isQuarterSlot(slot);
            var textW = slot.text ? measureText(slot.text, italic, metrics.font) : 0;
            var noteCount = (slot.notes || []).length;
            var noteSpan = noteCount > 1 ? (noteCount - 1) * NOTE_STEP + S * 1.5 : S * 1.5;
            // Rust = smal, zodat hij weinig horizontale ruimte inneemt (meer plek voor tekst).
            var slotW = isRest ? (S * 0.85) : Math.max(textW, noteSpan, metrics.minSlot);
            if (i > 0) {
                // Rust dicht tegen de omringende noot (kleine tussenruimte).
                if (isRest || slots[i - 1].rest) {
                    cursor += metrics.sylGap * 0.5;
                } else {
                    cursor += startsNewWord(slot) ? metrics.wordGap : metrics.sylGap;
                }
            }
            items.push({ slot: slot, center: cursor + slotW / 2, width: slotW, italic: italic });
            cursor += slotW;
        });
        return { items: items, naturalWidth: cursor || 1 };
    }

    function renderLine(svg, layout, stretch, xOffset, staffTopY, belowStaff, width, fifths, staffStartX, font, showClef, rowMeta, isFinalRow) {
        var midY = staffTopY + 2 * S;

        // y-positie uit een diatonische waarde
        function yFor(dia) {
            return midY - (dia - STAFF_LINE_MID) * (S / 2);
        }

        // 5 balklijnen over de volle breedte
        for (var i = 0; i < 5; i++) {
            var ly = staffTopY + i * S;
            svg.appendChild(el("line", {
                x1: LEFT_MARGIN, y1: ly, x2: width - RIGHT_MARGIN, y2: ly,
                stroke: "#16110a", "stroke-width": 1
            }));
        }

        if ((rowMeta && rowMeta.verseEnd) || isFinalRow) {
            svg.appendChild(el("line", {
                x1: width - RIGHT_MARGIN,
                y1: staffTopY,
                x2: width - RIGHT_MARGIN,
                y2: staffTopY + 4 * S,
                stroke: "#16110a",
                "stroke-width": 1.6
            }));
        }

        // Vioolsleutel (alleen op de eerste regel)
        if (showClef) {
            appendTrebleClef(svg, LEFT_MARGIN + 2, staffTopY, S);
        }

        // Voortekening (op elke regel, muzikaal correct). Op regels zonder sleutel
        // begint de voortekening links (de sleutelruimte vervalt).
        var keysigStartX = showClef ? (LEFT_MARGIN + CLEF_WIDTH) : (LEFT_MARGIN + 2);
        var positions = (fifths < 0 ? FLAT_POSITIONS : SHARP_POSITIONS).slice(0, Math.abs(fifths));
        var accGlyph = fifths < 0 ? "\u266D" : "\u266F";
        positions.forEach(function(dia, k) {
            var acc = el("text", {
                x: keysigStartX + k * 8,
                y: yFor(dia) + S * 0.6,
                "font-size": 2.2 * S,
                "font-family": "Georgia, serif",
                fill: "#16110a"
            });
            acc.textContent = accGlyph;
            svg.appendChild(acc);
        });

        // Noten per lettergreep (verspreid over de balk). Eerst alle notenkoppen
        // tekenen en de posities verzamelen, daarna stokken + balken (gebonden achtsten).
        var lineNotes = [];
        // Eerst alle lettergreep-centra bepalen (nodig om melisma-noten gelijkmatig
        // tussen deze en de volgende lettergreepnoot te kunnen verdelen).
        layout.items.forEach(function(item) {
            item.cx = staffStartX + xOffset + item.center * stretch;
        });
        layout.items.forEach(function(item, idx) {
            var notes = item.slot.notes || [];
            var cnt = notes.length;
            var step = NOTE_STEP * stretch;
            var melismaStart = cnt > 1 ? item.cx - step * (cnt - 1) / 2 : item.cx;
            notes.forEach(function(note, ni) {
                // Melisma-noten blijven binnen hun eigen slot: ruim genoeg voor de
                // vervolgnoten, maar nooit voorbij de volgende lettergreepnoot.
                var nx = cnt > 1 ? melismaStart + step * ni : item.cx;
                if (note.rest) {
                    drawRest(svg, note, nx, staffTopY);
                    lineNotes.push({ rest: true });
                    return;
                }
                var head = drawNoteHead(svg, note, nx, staffTopY, yFor, fifths);
                lineNotes.push({ note: note, x: nx, dia: head.dia, y: head.y, playbackId: note.playbackId || "" });
            });
        });
        drawStemsAndBeams(svg, lineNotes);

        // Weergave 'noten': geen lettergrepen onder de noten tekenen.
        if (!SHOW_LYRICS) return;

        // Tekst per heel woord: lettergrepen aaneengesloten, gecentreerd onder de noten.
        // Anti-overlap: elk woord komt minstens een kleine marge na het vorige woord.
        var i = 0;
        var prevRight = -Infinity;
        var minWordGap = font * 0.32;
        var versePrefixPending = !!(rowMeta && rowMeta.showVerseLabel && rowMeta.verseStart && rowMeta.verseNumber != null);
        var versePrefix = versePrefixPending ? (String(rowMeta.verseNumber) + ". ") : "";
        while (i < layout.items.length) {
            var j = i;
            while (j + 1 < layout.items.length && !startsNewWord(layout.items[j + 1].slot)) {
                j++;
            }
            var syllables = [];
            for (var k = i; k <= j; k++) {
                var kSlot = layout.items[k].slot;
                if (kSlot.rest) { continue; }
                var t = kSlot.text || "";
                if (t) {
                    // Cursief per lettergreep; lettergrepen blijven aaneengesloten.
                    var playbackIds = (kSlot.notes || []).map(function(note) {
                        return note.playbackId || "";
                    }).filter(Boolean);
                    syllables.push({
                        text: t,
                        italic: layout.items[k].italic,
                        playbackIds: playbackIds
                    });
                    // Melisma via MEERDERE noten op één lettergreep (lyricSlot=false in de
                    // melodie): een liggend streepje per vervolgnoot (bv. gezangen).
                    var extraNotes = (kSlot.notes || []).length - 1;
                    for (var mm = 0; mm < extraNotes; mm++) {
                        syllables.push({ text: "\u2009\u2013\u2009", italic: false, dash: true });
                    }
                } else if (syllables.length) {
                    // Lege lettergreep = melisma-vervolgnoot (psalm-model met lege tokens):
                    // toon een liggend streepje onder de vervolgnoot. Alleen in de
                    // notenweergave; tekst-only toont het hele woord (bv. "weldadig").
                    syllables.push({ text: "\u2009\u2013\u2009", italic: false, dash: true });
                }
            }
            if (syllables.length) {
                if (versePrefixPending) {
                    syllables[0].text = versePrefix + syllables[0].text;
                    versePrefixPending = false;
                }
                var wordW = 0;
                for (var w = 0; w < syllables.length; w++) {
                    wordW += measureText(syllables[w].text, syllables[w].italic, font);
                }
                var cxMid = (layout.items[i].cx + layout.items[j].cx) / 2;
                // Zo nodig naar rechts schuiven zodat het niet over het vorige woord valt.
                if (cxMid - wordW / 2 < prevRight + minWordGap) {
                    cxMid = prevRight + minWordGap + wordW / 2;
                }
                drawWordText(svg, syllables, cxMid, staffTopY, belowStaff, font);
                prevRight = cxMid + wordW / 2;
            }
            i = j + 1;
        }
    }

    // Stokken en balken. Opeenvolgende achtste noten (zonder rust ertussen)
    // worden 'gebonden' met een gezamenlijke balk; losse achtsten krijgen een vlag.
    function drawStemsAndBeams(svg, lineNotes) {
        var i = 0;
        while (i < lineNotes.length) {
            var n = lineNotes[i];
            if (n.rest || !n.note) { i++; continue; }
            if (n.note.type === "eighth") {
                var j = i;
                while (j + 1 < lineNotes.length &&
                       lineNotes[j + 1].note && !lineNotes[j + 1].rest &&
                       lineNotes[j + 1].note.type === "eighth") {
                    j++;
                }
                if (j > i) {
                    drawBeamGroup(svg, lineNotes, i, j);
                    i = j + 1;
                    continue;
                }
                drawSingleStem(svg, n, true);
                i++;
                continue;
            }
            if (n.note.type !== "whole") {
                drawSingleStem(svg, n, false);
            }
            i++;
        }
    }

    function drawSingleStem(svg, n, withFlag) {
        var stemUp = n.dia < STAFF_LINE_MID;
        var stemX = stemUp ? n.x + S * 0.58 : n.x - S * 0.58;
        var stemY2 = stemUp ? n.y - 3.3 * S : n.y + 3.3 * S;
        svg.appendChild(el("line", {
            x1: stemX, y1: n.y, x2: stemX, y2: stemY2,
            stroke: "#16110a", "stroke-width": 1.5,
            "class": "playback-note",
            "data-playback-id": n.playbackId || ""
        }));
        // Vlag bij losse achtste noten (rechts van de stok, krult naar de kop toe)
        if (withFlag) {
            var d = stemUp ? 1 : -1;
            svg.appendChild(el("path", {
                d: "M " + stemX + " " + stemY2 +
                   " Q " + (stemX + S * 1.5) + " " + (stemY2 + d * S * 0.8) + " " +
                           (stemX + S * 0.6) + " " + (stemY2 + d * S * 2.1) +
                   " Q " + (stemX + S * 1.0) + " " + (stemY2 + d * S * 0.9) + " " +
                           stemX + " " + (stemY2 + d * S * 0.7) + " Z",
                fill: "#16110a",
                "class": "playback-note-filled",
                "data-playback-id": n.playbackId || ""
            }));
        }
    }

    // Balkgroep: één gezamenlijke stokrichting en een horizontale balk.
    function drawBeamGroup(svg, lineNotes, a, b) {
        var sum = 0;
        for (var k = a; k <= b; k++) { sum += lineNotes[k].dia; }
        var stemUp = (sum / (b - a + 1)) < STAFF_LINE_MID;
        var stemLen = 3.3 * S;
        var beamY;
        if (stemUp) {
            beamY = Infinity;
            for (k = a; k <= b; k++) { beamY = Math.min(beamY, lineNotes[k].y - stemLen); }
        } else {
            beamY = -Infinity;
            for (k = a; k <= b; k++) { beamY = Math.max(beamY, lineNotes[k].y + stemLen); }
        }
        var xs = [];
        for (k = a; k <= b; k++) {
            var stemX = stemUp ? lineNotes[k].x + S * 0.58 : lineNotes[k].x - S * 0.58;
            xs.push(stemX);
            svg.appendChild(el("line", {
                x1: stemX, y1: lineNotes[k].y, x2: stemX, y2: beamY,
                stroke: "#16110a", "stroke-width": 1.5,
                "class": "playback-note",
                "data-playback-id": lineNotes[k].playbackId || ""
            }));
        }
        var beamThick = S * 0.55;
        var xLeft = xs[0];
        var xRight = xs[xs.length - 1];
        svg.appendChild(el("rect", {
            x: Math.min(xLeft, xRight),
            y: beamY - beamThick / 2,
            width: Math.abs(xRight - xLeft),
            height: beamThick,
            fill: "#16110a"
        }));
    }

    function drawWordText(svg, syllables, cxMid, staffTopY, belowStaff, font) {
        var textY = staffTopY + 4 * S + belowStaff + TEXT_GAP + font * 0.5;
        var text = el("text", {
            x: cxMid,
            y: textY,
            "text-anchor": "middle",
            "font-size": font,
            "font-family": "'Roboto', sans-serif",
            fill: "#16110a"
        });
        // Lettergrepen aaneengesloten binnen het woord (cursief per lettergreep).
        syllables.forEach(function(syl) {
            var tspan = el("tspan", {
                "font-style": syl.italic ? "italic" : "normal",
                "class": syl.playbackIds && syl.playbackIds.length ? "playback-lyric" : "",
                "data-playback-ids": syl.playbackIds ? syl.playbackIds.join("|") : ""
            });
            // Melisma-streepje iets kleiner dan de tekst.
            if (syl.dash) { tspan.setAttribute("font-size", (font * 0.7).toFixed(2)); }
            tspan.textContent = syl.text;
            text.appendChild(tspan);
        });
        svg.appendChild(text);
    }

    function drawNoteHead(svg, note, x, staffTopY, yFor, fifths) {
        var dia = diatonic(note.step, note.octave);
        var y = yFor(dia);
        var open = note.type === "half" || note.type === "whole";

        // Hulplijntjes (ledger lines)
        drawLedgerLines(svg, dia, x, yFor);

        // Voorteken indien afwijkend van de sleutel
        var keyAlter = keyAlterForStep(note.step, fifths);
        if (note.alter !== keyAlter) {
            var glyph = note.alter > 0 ? "\u266F" : (note.alter < 0 ? "\u266D" : "\u266E");
            var acc = el("text", {
                x: x - S * 1.1, y: y + S * 0.55,
                "text-anchor": "middle",
                "font-size": 2.2 * S,
                "font-family": "Georgia, serif",
                "class": "playback-note-filled",
                "data-playback-id": note.playbackId || "",
                fill: "#16110a"
            });
            acc.textContent = glyph;
            svg.appendChild(acc);
        }

        // Notenkop
        svg.appendChild(el("ellipse", {
            cx: x, cy: y,
            rx: S * 0.62, ry: S * 0.48,
            transform: "rotate(-18 " + x + " " + y + ")",
            "class": open ? "playback-note" : "playback-note playback-note-filled",
            "data-playback-id": note.playbackId || "",
            fill: open ? "none" : "#16110a",
            stroke: "#16110a",
            "stroke-width": open ? 1.6 : 1
        }));

        // Punt (dotted)
        if (note.dot) {
            svg.appendChild(el("circle", {
                cx: x + S * 0.95, cy: y - S * 0.15, r: S * 0.16,
                "class": "playback-note-filled",
                "data-playback-id": note.playbackId || "",
                fill: "#16110a"
            }));
        }

        return { dia: dia, y: y };
    }

    // Rust-symbool (achtste/kwart/half/hele) op de balk, met het muzieklettertype.
    function drawRest(svg, note, x, staffTopY) {
        var midY = staffTopY + 2 * S;
        var glyph, y;
        if (note.type === "whole") { glyph = "\uD834\uDD3B"; y = staffTopY + 1.9 * S; }
        else if (note.type === "half") { glyph = "\uD834\uDD3C"; y = staffTopY + 2.75 * S; }
        else if (note.type === "eighth") { glyph = "\uD834\uDD3E"; y = midY + 0.9 * S; }
        else { glyph = "\uD834\uDD3D"; y = midY + 1.15 * S; }
        var t = el("text", {
            x: x, y: y,
            "text-anchor": "middle",
            "font-size": 3.0 * S,
            "font-family": "Bravura, 'Noto Music', Georgia, serif",
            fill: "#16110a"
        });
        t.textContent = glyph;
        svg.appendChild(t);
    }

    function drawLedgerLines(svg, dia, x, yFor) {
        var half = S * 0.95;
        if (dia > STAFF_LINE_TOP) {
            for (var lv = STAFF_LINE_TOP + 2; lv <= dia; lv += 2) {
                var yy = yFor(lv);
                svg.appendChild(el("line", {
                    x1: x - half, y1: yy, x2: x + half, y2: yy,
                    stroke: "#16110a", "stroke-width": 1
                }));
            }
        } else if (dia < STAFF_LINE_BOTTOM) {
            for (var lw = STAFF_LINE_BOTTOM - 2; lw >= dia; lw -= 2) {
                var yb = yFor(lw);
                svg.appendChild(el("line", {
                    x1: x - half, y1: yb, x2: x + half, y2: yb,
                    stroke: "#16110a", "stroke-width": 1
                }));
            }
        }
    }

    function startsNewWord(slot) {
        if (slot.rest) { return true; }        // een rust breekt het woord altijd af
        if (!slot.text) { return false; }      // lege melisma-slot hoort bij het vorige woord (wordt een dash)
        var syl = slot.syllabic || "single";
        return syl === "single" || syl === "begin";
    }

    function isQuarterSlot(slot) {
        if (HAS_EIGHTH_NOTES) { return false; }
        var notes = slot.notes || [];
        return notes.length === 1 && notes[0].type === "quarter";
    }

    function renderControls() {
        var top = document.getElementById("controls-top");
        var bottom = document.getElementById("controls-bottom");
        var section = document.getElementById("verse-section");
        top.innerHTML = "";
        bottom.innerHTML = "";
        section.innerHTML = "";

        // Boven de balk: tekst/notengrootte eerst; toonsoort het dichtst bij de noten.
        top.appendChild(stepperRow("", "Tekstgrootte", safeCall(function() { return Android.getTextScaleLabel(); }, ""),
            "text_decrease", function() { Android.adjustTextScale(-0.2); },
            "text_increase", function() { Android.adjustTextScale(0.2); }));
        var notenRow = stepperRow("", "Notenbalk", safeCall(function() { return Android.getNoteScaleLabel(); }, ""),
            "zoom_out", function() { Android.adjustNoteScale(-0.1); },
            "zoom_in", function() { Android.adjustNoteScale(0.1); });
        top.appendChild(notenRow);
        top.appendChild(stepperRow("", "Toonsoort", safeCall(function() { return Android.getTranspositionLabel(); }, ""),
            "chevron_left", function() { Android.transposeBy(-1); },
            "chevron_right", function() { Android.transposeBy(1); }));

        // Onder de balk: gebruik ná de muziek/zang (Vorige/Volgende + versnummers).
        var items = [];
        try {
            items = JSON.parse(Android.getVerseMatrixItems());
        } catch (e) {
            items = [];
        }

        var nav = document.createElement("div");
        nav.className = "nav-row";
        var prev = document.createElement("button");
        prev.textContent = "Vorige";
        prev.disabled = !Android.hasPreviousVerse();
        prev.addEventListener("click", function() { Android.openPreviousVerse(); });
        var next = document.createElement("button");
        next.textContent = "Volgende";
        next.disabled = !Android.hasNextVerse();
        next.addEventListener("click", function() { Android.openNextVerse(); });
        nav.appendChild(prev);
        nav.appendChild(next);
        bottom.appendChild(nav);

        if (items.length) {
            var matrix = document.createElement("div");
            matrix.className = "verse-matrix";
            items.forEach(function(item) {
                var button = document.createElement("button");
                button.textContent = String(item.verse);
                if (item.current) {
                    button.className = "current";
                    button.disabled = true;
                } else {
                    button.addEventListener("click", function() {
                        Android.openVerseFile(item.fileName);
                    });
                }
                matrix.appendChild(button);
            });
            section.appendChild(matrix);
        }
    }

    var MATERIAL_PATHS = {
        format_size: "M5 4v3h5.5v12h3V7H19V4H5z",
        text_decrease: "M2 4h14v2H2V4zm0 7h10v2H2v-2zm0 7h7v2H2v-2zm18-8v2h-2v2h-2v-2h-2v-2h2V8h2v2h2z",
        text_increase: "M2 4h14v2H2V4zm0 7h10v2H2v-2zm0 7h7v2H2v-2zm16-8V7h-2V5h2V2h2v3h2v2h-2v3h-2z",
        music_note: "M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z",
        queue_music: "M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v2H3v-2zm13-5v8.5c0 .83-.67 1.5-1.5 1.5S13 20.33 13 19.5s.67-1.5 1.5-1.5c.18 0 .34.03.5.09V9h5v2h-3z",
        zoom_out: "M9 4a5 5 0 1 0 3.54 8.54L16.5 16.5l1.5-1.5-3.96-3.96A5 5 0 0 0 9 4zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm-2 2v2h4V8H7z",
        zoom_in: "M9 4a5 5 0 1 0 3.54 8.54L16.5 16.5l1.5-1.5-3.96-3.96A5 5 0 0 0 9 4zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm-1 1v2H6v2h2v2h2v-2h2V9h-2V7H8z",
        chevron_left: "M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z",
        chevron_right: "M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"
    };

    function materialIcon(name, className) {
        var svg = document.createElementNS(SVGNS, "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("class", className || "");
        var path = document.createElementNS(SVGNS, "path");
        path.setAttribute("d", MATERIAL_PATHS[name] || MATERIAL_PATHS.music_note);
        svg.appendChild(path);
        return svg;
    }

    function stepperRow(iconName, label, value, minusIcon, onMinus, plusIcon, onPlus) {
        var row = document.createElement("div");
        row.className = "ctrl-row";

        var name = document.createElement("div");
        name.className = "label";
        name.appendChild(document.createTextNode(label));

        var minus = document.createElement("button");
        minus.textContent = "−";
        minus.setAttribute("aria-label", "Verkleinen");
        minus.addEventListener("click", onMinus);

        var val = document.createElement("div");
        val.className = "value";
        val.textContent = value;

        var plus = document.createElement("button");
        plus.textContent = "+";
        plus.setAttribute("aria-label", "Vergroten of verhogen");
        plus.addEventListener("click", onPlus);

        row.appendChild(name);
        row.appendChild(minus);
        row.appendChild(val);
        row.appendChild(plus);
        return row;
    }

    function safeCall(fn, fallback) {
        try {
            return fn();
        } catch (e) {
            return fallback;
        }
    }

    function showError(message) {
        document.getElementById("controls").innerHTML =
            '<div class="error">' + message + "</div>";
    }

    window.renderScore = renderScore;
    window.updateScore = updateScore;
    window.getVerseRanges = function() {
        return JSON.stringify(window.__verseRanges || []);
    };
    window.getPdfExportState = function() {
        var root = document.getElementById("root");
        var dpr = window.devicePixelRatio || 1;
        var contentHeight = root ? Math.ceil((root.scrollHeight || root.offsetHeight || 0) * dpr) : 0;
        var scaledRanges = (window.__verseRanges || []).map(function(range) {
            return {
                startY: Math.ceil((range.startY || 0) * dpr),
                endY: Math.ceil((range.endY || 0) * dpr)
            };
        });
        return JSON.stringify({
            verseRanges: scaledRanges,
            contentHeightPx: contentHeight
        });
    };
    window.addEventListener("resize", function() {
        if (window.__hasModel) {
            renderScore();
        }
    });
    </script>
